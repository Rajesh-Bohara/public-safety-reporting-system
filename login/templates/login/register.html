{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Public Safety Platform</title>

    <link rel="stylesheet" href="{% static 'login/css/register.css' %}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="register-box">

        <div class="logo">🚨</div>

        <h2>Create Account</h2>

        <p>Join the Public Safety Platform</p>

        <form method="POST" id="registerForm">

            {% csrf_token %}

            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input
                    type="text"
                    name="fullname"
                    id="fullname"
                    placeholder="Full Name"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Email Address"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-phone"></i>
                <input
                    type="tel"
                    name="phone"
                    id="phone"
                    placeholder="Phone Number"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-location-dot"></i>
                <input
                    type="text"
                    name="address"
                    id="address"
                    placeholder="Address"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    required>

                <i class="fa-solid fa-eye togglePassword"></i>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="confirm_password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

                <i class="fa-solid fa-eye togglePassword"></i>
            </div>

            <div class="terms">
                <label>
                    <input
                        type="checkbox"
                        name="terms"
                        id="terms"
                        required>

                    I agree to the Terms & Conditions
                </label>
            </div>

            <button type="submit">
                Register
            </button>

            <div class="login-link">
                Already have an account?

               <a href="{% url 'login' %}">Login</a>

            </div>

        </form>

    </div>

</div>

{% comment %} <script src="{% static 'login/js/register.js' %}"></script> {% endcomment %}

</body>
</html>
