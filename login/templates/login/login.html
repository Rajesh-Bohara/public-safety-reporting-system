{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Report Login</title>

    <link rel="stylesheet" href="{% static 'login/css/login.css' %}">
</head>

<body>

<div class="container">

    <div class="login-box">

        <!-- SKIP BUTTON -->
        <div style="width: 100%; text-align: right; margin-bottom: 10px;">
            <a href="{% url 'dashboard' %}"
               style="
                    color: #2563eb;
                    text-decoration: none;
                    font-size: 17px;
                    font-weight: 600;
               ">
                Skip
            </a>
        </div>


        <h2>Public Safety Reporting System</h2>


        {% if messages %}
            {% for message in messages %}
                <p class="message">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <input
                type="email"
                name="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign In
            </button>

        </form>


        <p class="register-text">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>
        </p>

    </div>

</div>

</body>
</html>
